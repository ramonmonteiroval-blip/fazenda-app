<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fazenda">
<title>Controle Fazenda</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#F2F5F3;--panel:#FFFFFF;--ink:#1F2A22;--muted:#5F6B62;--line:#D8DED9;
  --gain:#1E7A3C;--loss:#B3261E;--azul:#1F6FB5;--accent:#2F5D3A;--accent-ink:#FFFFFF;
  --mono:ui-monospace,Menlo,Consolas,"Courier New",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101612;--panel:#18211B;--ink:#E6EEE8;--muted:#9AA79E;--line:#2C3A30;
    --gain:#3DD68C;--loss:#F0686A;--azul:#6CB4F0;--accent:#3F7A4F;--accent-ink:#F4F8F5;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(32px + env(safe-area-inset-bottom,0px));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));line-height:1.4}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:8px;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--accent)}
.brand svg{width:34px;height:34px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:6px;cursor:pointer;min-height:40px}
button:disabled{opacity:.6;cursor:default}
button.sec{background:var(--panel);color:var(--ink);border-color:var(--line)}
button.primary{font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;font-size:15px;width:100%;padding:7px 9px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:600}
.mes{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mes b{flex:1;text-align:center}
.mes button{min-width:44px}
.resumo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center}
.resumo span{font-size:12px;color:var(--muted);display:block}
.resumo b{display:block;font-family:var(--mono);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.saldo{font-size:16px;font-weight:700;font-family:var(--sans)}
.mut{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
form.novo{display:grid;gap:6px}
.linha{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0;border-bottom:1px solid var(--line);align-items:center}
.linha:last-child{border-bottom:0}
.linha b{overflow-wrap:anywhere}
.linha > div.receita > b,.linha > div.despesa > b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.acoes{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap;margin-top:0}
.acoes button{font-size:13px;min-height:32px;padding:4px 8px;background:var(--panel);color:var(--accent);border-color:var(--line)}
.pill{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:3px;color:var(--muted);margin-left:4px}
.receita{color:var(--gain)}.despesa{color:var(--loss)}.azul{color:var(--azul)}
.tela-login{text-align:center;padding:60px 10px}
.erro{color:var(--loss);font-size:13px}
h1{font-size:20px;margin:0}
</style>
</head>
<body>

<div id="login" class="tela-login" hidden>
  <h1>Controle Fazenda</h1>
  <p class="mut">Acesso restrito aos dois sócios.</p>
  <button id="btnEntrar">Entrar com Google</button>
  <p id="erroLogin" class="erro"></p>
</div>

<div id="app" class="wrap" hidden>
  <header>
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#2F5D3A"/><path d="M14 30 32 15l18 15v20H14z" fill="none" stroke="#B9E3C4" stroke-width="4" stroke-linejoin="round"/><rect x="27" y="36" width="10" height="14" fill="#B9E3C4"/></svg>
      <span>Controle Fazenda</span>
    </div>
    <div class="btns"><span id="usuario" class="mut"></span><button class="sec" id="btnSair">Sair</button></div>
  </header>

  <div class="card mes">
    <button class="sec" id="mesAnt" aria-label="Mês anterior">‹</button>
    <b id="rotuloMes"></b>
    <button class="sec" id="mesProx" aria-label="Próximo mês">›</button>
  </div>

  <div class="card resumo">
    <div><span>Receitas</span><b class="receita" id="tRec"></b></div>
    <div><span>Despesas</span><b class="despesa" id="tDes"></b></div>
    <div><span>Resultado</span><b id="tRes"></b></div>
  </div>

  <div class="card">
    <div class="saldo" id="saldo"></div>
    <div class="mut">Acerto geral (todos os meses, só o que já foi pago/recebido).</div>
  </div>

  <div class="card">
    <h3>Novo lançamento</h3>
    <form class="novo" id="form">
      <div class="grid2">
        <select id="tipo"><option value="despesa">Despesa</option><option value="receita">Receita</option></select>
        <select id="situacao"><option value="realizado">Já pago/recebido</option><option value="previsto">A prazo (previsto)</option></select>
      </div>
      <input id="valor" inputmode="decimal" placeholder="Valor (ex: 1.250,00)" required>
      <div class="grid2">
        <select id="quem"><option>Ramon</option><option>Vicente</option></select>
        <input id="data" type="date" required>
      </div>
      <select id="categoria"></select>
      <input id="descricao" placeholder="Descrição (ex: ração do lote 3)" required>
      <button type="submit" class="primary">Salvar lançamento</button>
      <p class="mut">Despesa: quem pagou. Receita: quem recebeu.</p>
    </form>
  </div>

  <div class="card">
    <h3>Lançamentos do mês</h3>
    <div id="lista"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, where, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import * as L from './logica.js';

const firebaseConfig = {
  apiKey: "AIzaSyDc6hX7oFYw9-G6h0qjGraxxPbQ4qqXhbo",
  authDomain: "controle-fazenda-r-v.firebaseapp.com",
  projectId: "controle-fazenda-r-v",
  storageBucket: "controle-fazenda-r-v.firebasestorage.app",
  messagingSenderId: "978557547049",
  appId: "1:978557547049:web:72ee67c27bf04cdc1e6238"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);
const brl = (c) => L.formatarBRL(c);

let mes = L.mesAtual();
let todos = [];
let unsub = null;

// Preenche categorias e data padrão.
$('categoria').innerHTML = L.CATEGORIAS.map((c) => `<option>${c}</option>`).join('');
$('data').value = new Date().toISOString().slice(0, 10);

$('btnEntrar').onclick = async () => {
  $('erroLogin').textContent = '';
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    $('erroLogin').textContent = 'Não foi possível entrar: ' + (e.code || e.message);
  }
};
$('btnSair').onclick = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) {
    $('app').hidden = true; $('login').hidden = false; return;
  }
  const nome = L.SOCIOS[user.email];
  if (!nome) {
    // E-mail fora dos sócios: sai imediatamente.
    signOut(auth);
    $('erroLogin').textContent = 'Esta conta não tem acesso.';
    $('login').hidden = false; $('app').hidden = true; return;
  }
  $('usuario').textContent = nome;
  $('login').hidden = true; $('app').hidden = false;
  // Tempo real: qualquer alteração aparece nos dois celulares.
  unsub = onSnapshot(collection(db, 'lancamentos'), (snap) => {
    todos = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => { $('lista').innerHTML = `<p class="erro">Sem permissão ou erro: ${err.code}</p>`; });
});

function render() {
  $('rotuloMes').textContent = rotuloMes(mes);
  const doMes = L.doMes(todos, mes).sort((a, b) => a.data.localeCompare(b.data));
  const t = L.totaisMes(doMes);
  $('tRec').textContent = brl(t.receitas);
  $('tDes').textContent = brl(t.despesas);
  $('tRes').textContent = brl(t.resultado);
  $('tRes').className = t.resultado >= 0 ? 'azul' : 'despesa';
  $('saldo').textContent = L.quemDeveAQuem(L.calcularSaldo(todos));

  $('lista').innerHTML = doMes.length ? doMes.map(linhaHtml).join('') : '<p class="mut">Nenhum lançamento neste mês.</p>';
  document.querySelectorAll('[data-acao]').forEach((b) => b.onclick = acao);
}

function rotuloMes(ym) {
  const [a, m] = ym.split('-').map(Number);
  return new Date(a, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
}

function linhaHtml(l) {
  const cls = l.tipo === 'receita' ? 'receita' : 'despesa';
  const sit = l.situacao === 'realizado' ? 'realizado' : 'previsto';
  const [y, m, d] = l.data.split('-');
  const quemLabel = l.tipo === 'receita' ? `recebido por ${l.quem}` : `pago por ${l.quem}`;
  return `<div class="linha">
    <div><b>${escapar(l.descricao)}</b> <span class="pill">${sit}</span><div class="mut">${d}/${m} · ${escapar(l.categoria)} · ${quemLabel}</div></div>
    <div class="${cls}"><b>${l.tipo === 'receita' ? '+' : '-'} ${brl(l.valor)}</b></div>
    <div class="acoes" style="grid-column:1/-1">
      <button class="sec" data-acao="situacao" data-id="${l.id}" data-sit="${sit}">${sit === 'realizado' ? 'Marcar como previsto' : 'Marcar como pago/recebido'}</button>
      <button class="sec" data-acao="excluir" data-id="${l.id}">Excluir</button>
    </div>
  </div>`;
}

function escapar(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function acao(ev) {
  const id = ev.currentTarget.dataset.id;
  if (ev.currentTarget.dataset.acao === 'situacao') {
    const novo = ev.currentTarget.dataset.sit === 'realizado' ? 'previsto' : 'realizado';
    await updateDoc(doc(db, 'lancamentos', id), { situacao: novo });
  } else if (ev.currentTarget.dataset.acao === 'excluir') {
    if (confirm('Excluir este lançamento? Não tem volta.')) await deleteDoc(doc(db, 'lancamentos', id));
  }
}

$('mesAnt').onclick = () => { mes = L.mudaMes(mes, -1); render(); };
$('mesProx').onclick = () => { mes = L.mudaMes(mes, 1); render(); };

$('form').onsubmit = async (e) => {
  e.preventDefault();
  const valor = L.parseMoeda($('valor').value);
  if (valor <= 0) { alert('Informe um valor maior que zero.'); return; }
  const dados = {
    tipo: $('tipo').value,
    situacao: $('situacao').value,
    valor,
    quem: $('quem').value,
    data: $('data').value,
    categoria: $('categoria').value,
    descricao: $('descricao').value.trim(),
    criadoEm: serverTimestamp(),
    criadoPor: auth.currentUser.email,
  };
  await addDoc(collection(db, 'lancamentos'), dados);
  $('valor').value = ''; $('descricao').value = '';
  mes = dados.data.slice(0, 7);
  render();
};

// Máscara de moeda: digita só números e formata 1.234,56.
$('valor').addEventListener('input', (e) => {
  const digitos = e.target.value.replace(/\D/g, '');
  const c = parseInt(digitos || '0', 10);
  e.target.value = (c / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
});
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
</html>
